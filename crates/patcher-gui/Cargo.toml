[package]
name = "patcher-gui"
description = "Installer-style GUI for standalone patchers: themes, UI bundles and the Slint runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Packing UI bundles needs a zstd encoder; only the creator enables it.
pack = ["dep:zstd"]

[dependencies]
bitcode.workspace = true
patcher-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
spin_on = "0.1"
thiserror.workspace = true
png = "0.18.1"
toml = "1.1.8"
ttf-parser = "0.25.1"
xxhash-rust.workspace = true
zstd = { version = "0.14.2", optional = true }

[dev-dependencies]
