[package]
name = "patcher-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
patcher-core.workspace = true
patcher-create.workspace = true
patcher-gui = { workspace = true, features = ["pack"] }
rayon.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[[bin]]
name = "patcher"
path = "src/main.rs"
